# ISSI IS42S16160J / IS42S83200J, -7 speed grade, AC timing.
#
# PRIMARY TABLE: "AC ELECTRICAL CHARACTERISTICS", -7 column, from the
# IS42S83200J / IS42S16160J / IS45S... datasheet as rendered by the
# alldatasheet.net HTML mirror, page header "Rev. D 02/27/2025".
# Table notes (1,2,3,5) are NOT reproduced.
#
# REVISION CAVEAT: sim/sdram_checker.sv:20 cites "Rev. C4 (09/17/2020)".
# The -7 numbers agree (tRCD 15, tRP 15, tRAS 37, trc 60). Reconcile the
# revision against an ISSI-hosted PDF before signoff.
#
# DO NOT MIX TABLES: this part has no separate tRFC. Refresh recovery uses
# trc = 60 ns. Micron's 66 ns tRFC does not apply here. See also
# sim/sdram_checker.sv:20-22.

meta:
  part: IS42S16160J
  speed_grade: "-7"
  organization: "256Mb SDRAM, 16Meg x16 (also covers IS42S83200J x8), 4 banks, 8192 rows"
  io_standard: LVTTL
  vddq_v: 3.3
  gear: SDR
  table: "AC ELECTRICAL CHARACTERISTICS, -7 column, Rev. D 02/27/2025"
  mirror: "https://www.alldatasheet.net/html-pdf/2257691/ISSI/IS42S16160J-7BLI/2279/18/IS42S16160J-7BLI.html"

sources:
  T7: "ISSI IS42S16160J AC ELECTRICAL CHARACTERISTICS, -7 column (alldatasheet.net mirror, Rev. D 02/27/2025)"
  CHK: "sim/sdram_checker.sv header (cites Rev. C4 09/17/2020)"

