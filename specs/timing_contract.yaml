# SPDX-License-Identifier: Apache-2.0
# Timing Contract for the SDR SDRAM PHY (P0-1).
#
# This is a CONTRACT, not a datasheet and not a signoff report. It records
# which parameters exist, who owns each one, where the number comes from,
# and whether that number is known yet. Per checklist section 1 the three
# parameter classes are kept separate and are NOT mixed into one RTL module.
# Every status: TBD entry is an open gate; a null value must not be filled
# with a typ guess or a number borrowed from another speed grade.
#
# Status vocabulary is shared with specs/devices/*.yaml.
# Companion analysis: docs/TIMING_BUDGET.md

meta:
  version: 1
  scope: "Class S SDR SDRAM PHY, point-to-point, single rank, x8/x16"
  status: "open - P0-1 and P0-2 delivered, no signoff claim"
  architecture_record: "docs/ARCHITECTURE.md"
  companion_analysis: "docs/TIMING_BUDGET.md"
  interface: "specs/interface.yaml"
  device_specs:
    - "specs/devices/micron_mt48lc16m16a2-75.yaml"
    - "specs/devices/issi_is42s16160j-7.yaml"

p0_2_verification:
  layer2_model: "sim/sdram_timing_model.sv"
  capture_model: "sim/read_capture.sv"
  sweep_runner: "sim/sweep.sh"
  report: "docs/TIMING_SWEEP.md"
  note: "Feasibility study. T_BOARD is a placeholder, not a characterized delay. Fixed-phase limit confirmed at B = tCK - tAC."

operating_points:
  - id: baseline_100_cl2
    device: micron_mt48lc16m16a2-75
    tCK_ns: 10.0
    CL: 2
    tAC_max_ns: 6.0
    tOH_min_ns: 3.0
    ideal_setup_ceiling_ns: 4.0
    ideal_hold_ceiling_ns: 3.0
    derivation: "tCK - tAC_max ; tOH_min"
    status: "project baseline (flow/config.librelane.json CLOCK_PERIOD 10)"
    note: "tCK equals tCK(2) min exactly; the DRAM itself has no frequency margin"
  - id: fast_133_cl3
    device: micron_mt48lc16m16a2-75
    tCK_ns: 7.5
    CL: 3
    tAC_max_ns: 5.4
    tOH_min_ns: 3.0
    ideal_setup_ceiling_ns: 2.1
    ideal_hold_ceiling_ns: 3.0
    derivation: "tCK - tAC_max ; tOH_min"
    status: "extension target"
    note: "tCK equals tCK(3) min exactly"
  - id: issi_133_cl2
    device: issi_is42s16160j-7
    tCK_ns: 7.5
    CL: 2
    tAC_max_ns: 5.4
    tOH_min_ns: 2.5
    ideal_setup_ceiling_ns: 2.1
    ideal_hold_ceiling_ns: 2.5
    derivation: "tCK - tAC_max ; tOH_min"
    status: "alternative device"

operating_points_caveat: "Ceilings assume zero round-trip delay, zero RX setup/hold and zero uncertainty. They are upper bounds, not achievable margins."

parameter_classes:

  protocol:
    owner: controller
    note: "Geometry and DRAM command semantics. Already RTL parameters in rtl/sdr_phy.sv."
    params:
      - {id: DATA_BITS, value: 8, unit: bits, src: RTL, status: fixed, note: "sdr_phy supports x16; sdr_ctrl.sv:88 rejects DATA_BITS != 8"}
      - {id: ADDR_BITS, value: 13, unit: bits, src: RTL, status: fixed}
      - {id: BANK_BITS, value: 2, unit: bits, src: RTL, status: fixed}
      - {id: RANKS, value: 1, unit: ranks, src: RTL, status: fixed}
      - {id: CL, value: 2, unit: cycles, src: RTL, status: fixed, note: "2 or 3"}
      - {id: BL, value: 1, unit: beats, src: RTL, status: fixed, note: "model supports BL 1/2/4/8 writes (tb/tb_burst.sv); controller/PHY default remains BL=1"}
      - {id: nphases, value: 1, unit: phases, src: RTL, status: fixed}
      - {id: write_latency, value: 0, unit: cycles, src: RTL, status: fixed}
      - {id: read_latency, value: "CL+1", unit: cycles, src: RTL, status: fixed, note: "Standalone sdr_phy. Integrated sdram_phy_top uses CL-2+CDC_LATENCY+1 (measured 7 at CL=2, CDC=6); see interface.yaml and reports/litedram_cosim.log."}

  timing:
    owner: "PHY + board"
    note: "Clock phase, capture phase, OE and device AC limits. NONE of this is in the RTL today."
    params:
      - {id: tCK, value: 10.0, unit: ns, src: RTL, status: fixed}
      - {id: tAC_max, value: 6.0, unit: ns, src: DEVICE, status: known, note: "CL=2, Micron -75. CL=3 is 5.4."}
      - {id: tOH_min, value: 3.0, unit: ns, src: DEVICE, status: known}
      - {id: tDS_min, value: 1.5, unit: ns, src: DEVICE, status: known}
      - {id: tDH_min, value: 0.8, unit: ns, src: DEVICE, status: known}
      - {id: tHZ_max, value: 6.0, unit: ns, src: DEVICE, status: known}
      - {id: tLZ_min, value: 1.0, unit: ns, src: DEVICE, status: known}
      - {id: tAS_min, value: 1.5, unit: ns, src: DEVICE, status: known}
      - {id: tAH_min, value: 0.8, unit: ns, src: DEVICE, status: known}
      - {id: tCMS_min, value: 1.5, unit: ns, src: DEVICE, status: known}
      - {id: tCMH_min, value: 0.8, unit: ns, src: DEVICE, status: known}
      - {id: ck_phase, value: 0.0, unit: ns, src: STA, status: known, note: "P1-3 path B: no delay cell; the write launch is half a cycle ahead of the pipelined pin command, so the effective relative phase is +tCK/2 by construction (rtl/sdr_phy.sv)"}
      - {id: delta_capture, value: 0.0, unit: ns, src: STA, status: known, note: "read capture uses the generated cap_clk with phase_sel = 0 in this build"}
      - {id: tCLK_fwd_min, value: 0.385, unit: ns, src: STA_SPICE, status: known, note: "clk->pad_ck min over tt/ss/ff, unplaced STA + pad SPICE"}
      - {id: tCLK_fwd_max, value: 1.349, unit: ns, src: STA_SPICE, status: known, note: "clk->pad_ck max over tt/ss/ff"}
      - {id: tDQ_return_min, value: 0.204, unit: ns, src: STA_SPICE, status: known, note: "pad_dq -> capture FF min over tt/ss/ff"}
      - {id: tDQ_return_max, value: 1.383, unit: ns, src: STA_SPICE, status: known, note: "pad_dq -> capture FF max over tt/ss/ff"}
      - {id: tDQ_tx_min, value: 0.715, unit: ns, src: STA_SPICE, status: known, note: "FF -> pad_dq min over tt/ss/ff"}
      - {id: tDQ_tx_max, value: 2.711, unit: ns, src: STA_SPICE, status: known, note: "FF -> pad_dq max over tt/ss/ff; the limiting term at ss"}
      - {id: tRX_setup, value: 0.0, unit: ns, src: STA, status: known, note: "capture FF setup is inside the tDQ_return slack"}
      - {id: tRX_hold, value: 0.0, unit: ns, src: STA, status: known, note: "capture FF hold is inside the tDQ_return slack"}
      - {id: t_uncertainty, value: 0.60, unit: ns, src: ASSUMPTION, status: conservative, note: "CONSERVATIVE BOUND, not measured: 0.25 ns jitter/DCD + 0.20 ns OCV/PVT + 0.10 ns SSN + 0.05 ns pad skew (6 % of tCK). Must be replaced by a measured value before signoff. User decision 2026-11-27: held at 0.60 ns for now, to be resolved separately."}
      - {id: tOE_on, value: 0.608, unit: ns, src: SPICE, status: known, note: "max over the 5 P1-1 PVT points"}
      - {id: tOE_off, value: 3.299, unit: ns, src: SPICE, status: known, note: "max over the 5 P1-1 PVT points"}
      - {id: dq_bit_skew, value: 0.0055, unit: ns, src: ASSUMPTION, status: conservative, note: "1 mm matched-length tolerance x 5.5 ps/mm (P1-4 fixture); not measured on hardware"}
      - {id: cmd_addr_skew, value: 0.0055, unit: ns, src: ASSUMPTION, status: conservative, note: "same matched-length basis as dq_bit_skew"}
      - {id: clk_jitter, value: 0.25, unit: ns, src: ASSUMPTION, status: conservative, note: "part of t_uncertainty; no PLL/DLL characterization exists (gate G6)"}
      - {id: clk_dcd, value: 0.05, unit: ns, src: ASSUMPTION, status: conservative, note: "part of t_uncertainty"}
      - {id: board_flight, value: 0.342, unit: ns, src: SPICE, status: known, note: "P1-4 channel: 335-337 ps PAD->DRAM plus 5.5 ps skew; CK and DQ share the channel so only the skew survives subtraction"}
      - {id: package_rlc, value: "R 0.05 ohm / L 1.5 nH / C 0.4 pF", unit: expr, src: ASSUMPTION, status: conservative, note: "typical wire-bond IBIS [Package] range, not vendor data"}
      - {id: termination, value: "high-Z CMOS input + 1 Mohm bleed", unit: expr, src: ARCH, status: known, note: "SDR SDRAM inputs are high-impedance CMOS, not SSTL-3 terminated"}

  process:
    owner: "PDK backend"
    note: "Pad and analog backend. Entirely absent; see docs/ARCHITECTURE.md section 5."
    params:
      - {id: io_standard, value: LVTTL, unit: "-", src: ARCH, status: fixed}
      - {id: vddio_v, value: 3.3, unit: V, src: ARCH, status: fixed}
      - {id: pad_type, value: gf180_pad_core, unit: "-", src: LAYOUT, status: known, note: "GF180 bidirectional pad macro; DRC 0, LVS match, Magic RC-PEX"}
      - {id: drive_strength, value: "PMOS 200 um / NMOS 80 um", unit: "-", src: LAYOUT, status: known}
      - {id: level_shifter, value: none, unit: "-", src: ARCH, status: known, note: "core and IO are both 3.3 V on this backend"}
      - {id: esd, value: "ggNMOS 160 um + 2x64 um2 diodes", unit: "-", src: LAYOUT, status: partial, note: "cell verified (DRC clean, LVS match, PEX 28.4 V under 1 A/100 ns) but not connected to PAD in the ring; qualification needs TLP"}
      - {id: powerup_hiz, value: yes, unit: "-", src: RTL, status: known, note: "ck and the pad output are gated by io_power_ok; PU_OK low holds the output off"}
      - {id: delay_cell, value: none, unit: "-", src: RTL, status: known, note: "P1-3 path B advances the write launch by half a cycle instead of delaying CK"}
      - {id: pll_dll, value: none, unit: "-", src: ARCH, status: known, note: "no PLL/DLL in this build; clock_forward.ck_phase_clks is the hook when one exists"}
      - {id: pad_slew, value: "1.64 ns / 1.53 ns at the DRAM pin", unit: "-", src: SPICE, status: known, note: "PEX-driven P1-4 channel, 10-90 % at the far end"}

modeling_plan:
  note: "How each TBD term is to be characterized. Methods only: no numbers are invented here."
  references:
    - "docs/SI_PI_PACKAGE_PCB.md"
    - "docs/DRAM_MODEL_REFERENCES.md"
  methods:
    package_rlc: "IBIS [Package] R_pkg/L_pkg/C_pkg as default; [Pin] R_pin/L_pin/C_pin per pin; [Package Model] for coupled networks"
    board_flight: "RLGC transmission line from stackup; t_flight ~= l*sqrt(L'C') ~= l*sqrt(eps_eff)/c; FR-4 roughly 5-7 ps/mm"
    termination: "board-level series/parallel from SI; DDR2 on-die ODT follows DFI odt"
    dq_bit_skew: "post-layout EM extraction or TDR/VNA, per byte lane"
    cmd_addr_skew: "same, plus multi-drop/DIMM topology if a module is ever used"
    clk_jitter: "PLL/DLL phase noise plus measurement; adpll_gen currently returns FAIL_UNCHARACTERIZED"
    clk_dcd: "duty-cycle distortion from pad/clock-tree SPICE"
    t_uncertainty: "sum of jitter + OCV + PVT + SSN + skew, not one guessed number"
    tOE_on: "pad SPICE with real load"
    tOE_off: "pad SPICE plus package/PCB Hi-Z transition"
    tRX_setup: "input pad plus capture FF from PDK Liberty"
    tRX_hold: "same, min corner"
    tCLK_fwd_min: "CK output pad + package + PCB, min corner"
    tCLK_fwd_max: "same, max corner"
    tDQ_return_min: "DQ input pad + package + PCB, min corner"
    tDQ_return_max: "same, max corner"
  limitation: "A lumped single-pin RLC has no mutual L/C; SSO/ground bounce and crosstalk need coupled RLC, multiport S-parameters or 3D EM. IBIS V/I,V/T buffer models and linear S-parameter networks are different model classes: joint active-driver plus passive-interconnect simulation needs an IBIS-capable solver or a verified IBIS-to-SPICE conversion. ngspice cannot consume arbitrary Touchstone files directly as a wideband transient device."

capability_gates:
  - id: G1
    rule: "Backend must provide a 3.3 V bidirectional LVTTL pad with ESD, level shifter and power-up Hi-Z."
    status: partial
    note: "GF180 pad macro delivered: DRC 0, LVS match, Magic RC-PEX, power-up Hi-Z gated by io_power_ok, no level shifter needed (core = IO = 3.3 V). ESD clamp cell verified but not connected inside the pad cell, and qualification needs TLP."
    maps_to: P0-3
  - id: G2
    rule: "No backend may fall back to a core standard cell to drive an external DQ."
    status: declared
  - id: G3
    rule: "A backend without a qualified IO macro is marked unsupported, not auto-downgraded."
    status: declared
  - id: G4
    rule: "A backend without a characterized delay/phase cell may claim fixed-phase only, not calibrated phase."
    status: met-as-fixed-phase
    note: "P1-3 path B closes the write budget without a delay cell by advancing the write launch half a cycle; the claim is fixed-phase only."

signoff_gates:
  - id: S1
    rule: "Every TBD in parameter_classes.timing and .process is verified or explicitly tagged as an assumption."
    status: closed-with-assumptions
    note: "No TBD remains. Measured terms cite STA/SPICE/LAYOUT sources; the five ASSUMPTION entries (t_uncertainty and its four components, dq/cmd skew, package_rlc) are explicitly tagged conservative and must be replaced by measurement before signoff."
  - id: S2
    rule: "Read/write budgets are recomputed with min/max pairing and emitted as reports/timing_margin.json."
    status: closed
    note: "reports/p1_3_margins.json has the per-corner min/max pairing; reports/timing_margin.json remains the P0-2 ideal-ceiling study."
  - id: S3
    rule: "Each operating point is classified fixed-phase-feasible / infeasible / needs-lower-frequency."
    status: deferred
    note: "Deferred by user decision on 2026-11-27: t_uncertainty stays at 0.60 ns and the user will replace it later. Recompute the operating-point classes when the measured uncertainty is available."
  - id: S4
    rule: "SDC paths (CMD TX, Write DQ TX, Read DQ RX, OE turnaround) exist and close at all PVT corners."
    status: partial
    note: "All four path groups plus CK_OUT exist and close pre-layout at tt/ss/ff (write setup +1.78 ns worst). Not closed: placement, CTS, SDF back-annotation."
    maps_to: P0-5
