# SYNTHETIC design fixture for demonstrating the packaged-layout closure.
#
# HONESTY: these are NOT real design values. They exist ONLY to exercise the
# full composite-constraint chain end-to-end with a real packaging profile.
# No width/ESD/current here is a signoff decision. Two constraints are
# expected to FAIL (cell_width_fits_pitch, rail_em) - that proves the solver
# detects conflicts instead of silently passing.
#
# Used by: python3 generator/solve_packaged.py --profile wafer_space_gf180_1x1 --design-fixture THIS
# Status: synthetic_fixture / verification-only. Never feed to emit_pads.py.
meta:
  status: synthetic_fixture
  purpose: "demonstrate the full 41-input -> 11-constraint closure chain"
  not_for: ["tapeout", "sizing decision", "emit_pads.py", "signoff"]
  expected_violations: ["cell_width_fits_pitch", "rail_em"]

