# SPDX-License-Identifier: Apache-2.0
# Packaging / assembly-house profile.
#
# A profile is an OPTIONAL, PLUGGABLE overlay that supplies ASSEMBLY-SPECIFIC
# geometry which the generic pdk_rules deliberately leave TBD (DRM 9.0:
# "Bond pad size and pitch are limited by assembly house"). The solver never
# hard-codes a PDK or an assembly house: it reads whichever profile is named
# via --profile. Adding sky130 / ihp130 / ics55 or another package = adding a
# file here, no code change.
#
# Evidence class: assembly_measured. This is STRONGER than foundry_doc
# because the numbers are measured directly from the publisher's golden mask
# GDS, not read off a prose page.

meta:
  schema_version: 1
  profile_id: wafer_space_gf180_1x1
  applies_to_pdk: gf180mcuD
  applies_to_backend: [gf180mcuD]
  assembly_house: "wafer.space (GF180MCU Run 1 / Run 3, Chip-on-Board option)"
  slot: 1x1
  status: "one concrete assembly commitment - NOT a universal rule"
  license: "Apache-2.0 (wafer-space/gf180mcu-precheck, gf180mcu-project-template, chip-on-board-wire-bonded-pcbs)"
  retrieved_on: "2026-11-16"
  evidence_class: assembly_measured
  note: "Run-specific. wafer.space states pinouts/footprints are run-specific and pad positions are pinned for COB. Do not generalize to other packages or PDKs."

# Where every number below comes from. The solver/checker re-verifies the
# golden-mask GDS sha256 if present under --verify-source (optional offline).
sources:
  golden_mask:
    url: "https://raw.githubusercontent.com/wafer-space/gf180mcu-precheck/main/assets/golden_masks/mask_1x1.gds"
    sha256: "77bbb647e191291255943cf343ef3b4a8c52e1b70cf3e34e631bd6a8bb188c66"
    measurement: "74 boxes, each 60x60um; centers extracted with KLayout pya (dbu=0.001)"
  slot_config:
    url: "https://raw.githubusercontent.com/wafer-space/gf180mcu-project-template/main/librelane/slots/slot_1x1.yaml"
    verbatim: "DIE_AREA: [0, 0, 3932, 5122]; CORE_AREA: [442, 442, 3490, 4680]"
  io_library:
    url: "https://gf180mcu-pdk.readthedocs.io/en/latest/IPs/IO/gf180mcu_fd_io/features.html"
    verbatim: "IO cell width 75um x height 350um; bond pad opening 60um x 60um"
  cob_rules:
    url: "https://github.com/wafer-space/chip-on-board-wire-bonded-pcbs"
    verbatim: "74-pad TT-convention padframe; PCB 14x16mm; wire angle <=45deg; max wire <3mm"

# Measured from golden mask. Two pitches because the die is not square and
# the pad counts differ per edge (S/N 17, E/W 20).
geometry:
  pad_opening_um: 60.0
  pad_opening_shape: "60 x 60 um square (74 openings)"
  pad_count_total: 74
  pad_count_south: 17
  pad_count_north: 17
  pad_count_east: 20
  pad_count_west: 20
  pitch_ns_um: 180.0     # SOUTH/NORTH center-to-center (16 diffs of 180.0)
  pitch_ew_um: 211.0     # EAST/WEST center-to-center (19 diffs of 211.0)
  pitch_min_um: 180.0    # conservative single value -> PAD_PITCH
  die_um: [3932.0, 5122.0]
  seal_ring_um: 26.0
  corner_pad_um: [355.0, 355.0]
  raw_centers:
    note: "first-column x=58.0; S/N x range 526..3406 step 180; E/W y range 556.5..4565.5 step 211"
    south_x_first: 526.0
    south_x_last: 3406.0
    west_y_first: 556.5
    west_y_last: 4565.5

# Values this profile overlays onto the generic constraint model. Keys MUST
# match pdk_rules ids. Only assembly-specific keys belong here.
overrides:
  PAD_PITCH: 180.0       # conservative (north/south) center-to-center
  PAD_OPENING: 60.0      # measured opening, not DRM PAD.1 default 40

# Design inputs that a real run would still have to choose. Kept EXPLICIT and
# flagged as assumptions so the first closure is honest about what it assumed.
assumptions:
  - id: IO_CURRENT
    value: 0.0152
    unit: A
    note: "SSTL-2 Class II 15.2mA; DESIGN choice, not assembly data."
  - id: DQ_BIT_SKEW_MAX
    value: 100.0
    unit: ps
    note: "Timing-budget placeholder for the demo; NOT from any datasheet."
# RAIL_WIDTH, ESD_AREA_MIN are intentionally NOT supplied: they need an ESD
# HBM target and are not assembly geometry. The closure demonstrates that
# even with a real package the design still has open gates.
