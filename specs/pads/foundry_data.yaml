# SPDX-License-Identifier: Apache-2.0
# Foundry / assembly-house data located on 2026-11-16 for the 8 TBD pdk_rules.
#
# SOURCE: GlobalFoundries GF180MCU PDK Design Rule Manual (DRM), published at
# gf180mcu-pdk.readthedocs.io. The PDK itself is Apache-2.0
# (Copyright 2022 GlobalFoundries PDK Authors). We record VALUES + verbatim
# snippets + URLs only; no manual text is copied into this repo.
#
# IMPORTANT HONESTY BOUNDARIES:
#  - The docs site states "This documentation is currently a work in progress"
#    and "Current Status - Experimental Preview". These are NOT signed-off
#    foundry commitments.
#  - DRM 9.2 note: bond-pad numbers are "default numbers for DRC purpose
#    only ... VARIABLE ... use the appropriate value acceptable to their
#    assembly house". DRM 9.0: "Bond pad size and pitch are limited by
#    assembly house" - NO center-to-center pitch value is given anywhere.
#  - DRM 14.4: TLP-to-HBM "miscorrelations" are explicitly acknowledged;
#    no HBM/MM target level is specified.
#  - Unlike verified (local PDK file:line, checked live), these are WEB
#    sources: they cannot be re-opened offline. status foundry_doc marks
#    this weaker evidence class.
#
# decision: fill (write into pdk_rules) | defer (record only)
# semantic_match: exact | derived | none

meta:
  pdk: gf180mcuD
  source: "GlobalFoundries GF180MCU PDK Design Rule Manual (readthedocs.io)"
  source_status: "Experimental Preview / work in progress"
  license: "Apache-2.0 (GF180MCU PDK); values + citations only, no text copied"
  retrieved_on: "2026-11-16"
  evidence_class: foundry_doc
  note: "Filled values are foundry-documented design-rule defaults, NOT a DRC-clean claim and NOT an assembly-house commitment."
  assembly_search:
    question: "public bonding diagram and pad pitch data?"
    searched_on: "2026-11-16"
    found: "GF180MCU DRM 9.0/9.2, gf180mcu_fd_io features, wafer.space slot specs + slots.json, wafer.space/gf180mcu-project-template slot_1x1.yaml, wafer.space/chip-on-board-wire-bonded-pcbs (Apache-2.0), IEEE SSCS Chipathon 2025 padring"
    pad_pitch_value: null
    pad_pitch_status: "NO explicit center-to-center pitch found in any public source"
    reason: "DRM 9.0 explicitly says pad size and pitch are limited by the assembly house; only IO cell width (75um), bond pad opening (60x60um and PAD.1=40um), pad counts and die dimensions are published. wafer.space pins 74 pads to fixed coordinates in slot_1x1.yaml but does not state a pitch number."
    license: "Apache-2.0 (wafer.space template / COB PCBs / GF180MCU PDK); values + citations only"

data:
  - id: METAL_JMAX
    applies_to: METAL_JMAX
    decision: fill
    semantic_match: exact
    value: 0.00067
    value_unit: A/um
    value_display: "0.67 mA/um"
    selection: "Table 14.3, Metal 1 - Top Metal-1, Unidirectional, 125 deg C (most conservative column). Value = 0.67 mA/um = 6.7e-4 A/um."
    source_url: "https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_14_2.html"
    drm_section: "14.2 Electro-migration, Table 14.3"
    verbatim: "Metal 1-Top Metal - 1 Unidirectional (CB) 2.09 / 1 / 0.67 (85/110/125 deg C, mA/um)"
    caveats:
      - "Per DRAWN WIDTH; layer- and temperature-dependent. Other columns: MetalTop 11kA uni 125C = 1.5 mA/um, 30kA = 5.37 mA/um; bi-directional is higher."
      - "Reliability basis: T0.1 > 100K hours at 85 deg C. Choosing 125 deg C is conservative for a 3.3V SDR pad."
      - "A VDDIO rail is unidirectional; DQ would use bi-directional. Selection must be revisited if the rail uses MetalTop."
    alternatives:
      - "MetalTop 11kA Unidirectional 125C: 1.5 mA/um"
      - "MetalTop 30kA Unidirectional 125C: 5.37 mA/um"
      - "Table 14.4 via1-5 unidirectional 125C: 0.18 mA per contact"

  - id: GUARD_RING_RULE_MIN
    applies_to: GUARD_RING_RULE_MIN
    decision: fill
    semantic_match: exact
    value: 2
    value_unit: um
    value_display: "2 um"
    selection: "DRM 14.3.2 IO.2 / IO.4 'Minimum recommended ... guard ring width' = 2um for LV and MV (Comment column: Rule)."
    source_url: "https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_14_3_2.html"
    drm_section: "14.3.2 I/O Latch-up Related Rules, IO.2 / IO.4"
    verbatim: "IO.2 Minimum recommended Nwell guard ring width ... 2 / 2 (LV/MV), Rule; IO.4 Minimum recommended PCOMP guard ring width ... 2 / 2, Rule"
    caveats:
      - "This is the I/O latch-up guard-ring WIDTH rule that the parameter names - unlike guard_ring.rb GR.* (seal-ring-to-die-edge), which is different physics."
      - "Wording is 'minimum recommended' though the table Comment says Rule."
      - "Adjacent rules (not this parameter): IO.1/IO.3 max guard-ring-to-diffusion space 15um; max tap distances 2um / 5um."

  - id: PAD_OPENING
    applies_to: PAD_OPENING
    decision: defer
    semantic_match: exact
    candidate_value: 40
    candidate_unit: um
    source_url: "https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_09_2.html"
    drm_section: "9.2 Bond Pad Guidelines, PAD.1"
    verbatim: "PAD.1 Pad opening: Wedge 40 / Ball 40 / Gold bump 4"
    caveats:
      - "Explicitly 'default numbers for DRC purpose only ... VARIABLE ... acceptable to their assembly house'."
      - "Gold-bump value is 4, not 40 - depends on assembly technology."
    blocked_by: "Assembly-house confirmation required; do not freeze a DRC default as a design constraint."
    assembly_sources:
      - "gf180mcu_fd_io/features.html: bond pad opening 60x60um; IO cell width 75um x height 350um (inclusive of bond pad); design grid 0.005um"
      - "wafer.space/chip-on-board-wire-bonded-pcbs (Apache-2.0): 74-pad TT-convention padframe, 14x16mm PCB, 70-pin 0.4mm-pitch mezzanine; wirebond rules: no crossing wires, angle <=45deg, max wire length <3mm, min 1mm or 2x die thickness"
      - "wafer.space/gf180mcu-project-template slot_1x1.yaml: DIE_AREA [0,0,3932,5122], CORE_AREA [442,442,3490,4680]; 17/17/20/20 pads on S/N/E/W = 74 total, pinned to fixed coordinates for COB"
    note: "Two different opening values are published (DRM PAD.1=40 vs IO library 60x60) - they describe different things or different pad cells; no assembly-house confirmation reconciles them. Keep TBD."

  - id: PAD_PITCH
    applies_to: PAD_PITCH
    decision: defer
    semantic_match: none
    source_url: "https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_09.html"
    drm_section: "9.0 Bond Pad"
    verbatim: "Bond pad size and pitch are limited by assembly house. The bond pad pitch and size should be increased whenever possible."
    related_numbers:
      - "PAD.2 pad opening to pad opening = 9 (wedge/ball/gold bump)"
      - "PAD.20 pad metal to pad metal space = 5"
    caveats:
      - "No center-to-center pitch value is given; foundry explicitly defers to the assembly house."
      - "PAD.2 is an edge-to-edge spacing, NOT a pitch. Deriving 40+9=49um would be an unlabelled inference."
    blocked_by: "No assembly-house / packaging data (bond diagram, package pad pitch). Public sources give pad COUNTS and die size but no center-to-center pitch."
    assembly_sources:
      - "wafer.space slot specs / slots.json: 1x1 die 3932x5122um, seal ring ~26um per side, 56 IO + 18 power = 74 pads; quarter slot 1936x2531um with 48 IO"
      - "gf180mcu_fd_io/features.html: IO cell width 75um (pitch would be >= 75um + spacing), corner cell 355x355um"
      - "IEEE SSCS Chipathon 2025: padring 2040x2040um usable, 88 pins (22 per side), QFN-88 reference"
      - "DRM 9.2 PAD.2 pad-opening-to-pad-opening = 9um, PAD.20 pad-metal-to-pad-metal = 5um; both are EDGE-TO-EDGE spacings, NOT center-to-center pitch"
    derived_only:
      - "From 1x1 die 3932um minus 2x355um corners, 17 pads -> average 189.5um spacing; from 5122um minus corners, 20 pads -> 220.6um. These are DERIVED averages, NOT a stated pitch, and depend on corner/filler assumptions. Do NOT fill."
    note: "wafer.space COB requires the default pad ring with pads at fixed coordinates (do not change pad count/position), so a real pitch exists in their GDS/PCB - but it is not published as a number in the inspected docs."

  - id: ESD_AREA_MIN
    applies_to: ESD_AREA_MIN
    decision: defer
    semantic_match: derived
    source_url: "https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/drm_14_5_2.html"
    drm_section: "14.5.2 ESD Performance from 3.3V LV N+/PWELL diode; 14.4.2 Design Guidelines"
    verbatim: "Second Breakdown Current (It2) ~27.5mA/um; Vt2 ~3.1V. 14.4.2: min cathode junction width DL 0.36um, recommended max finger width DW 40um."
    related_numbers:
      - "14.5.3 3.3V LV P+/NWELL diode It2 ~33.3mA/um"
      - "14.5.7 5V/6V HV N+/PWELL diode It2 ~30mA/um"
    caveats:
      - "It2 is per-micron TLP current capability, NOT an area. Converting to ESD_AREA_MIN needs an HBM/MM target level (e.g. 2kV -> peak current) that the DRM does NOT specify."
      - "DRM 14.4 explicitly warns of TLP-to-HBM miscorrelation (dV/dt, device turn-off during HBM decay)."
    blocked_by: "ESD target level (HBM kV) is a system requirement, not foundry data; TLP-to-HBM correlation unverified."

  - id: IO_CURRENT
    applies_to: IO_CURRENT
    decision: defer
    semantic_match: none
    note: "Design specification (SSTL-2 Class I 7.6mA / Class II 15.2mA), not foundry data. EM tables constrain how wide a metal must be for a given current, not what current the design demands."
    blocked_by: "Design decision."

  - id: DQ_BIT_SKEW_MAX
    applies_to: DQ_BIT_SKEW_MAX
    decision: defer
    semantic_match: none
    note: "Timing budget from P0-1 contract / board SI, not a foundry rule."
    blocked_by: "System timing budget."

  - id: RAIL_WIDTH
    applies_to: RAIL_WIDTH
    decision: defer
    semantic_match: derived
    note: "RAIL_WIDTH_FROM_EM = IO_CURRENT / METAL_JMAX is now computable once METAL_JMAX is filled, but IO_CURRENT remains a design input, so the constraint stays unresolved."
    blocked_by: "IO_CURRENT (design input)."
