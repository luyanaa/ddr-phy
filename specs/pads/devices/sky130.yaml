# sky130 device map. Names verified against the LOCAL PDK on 2026-11-16:
#   libs.ref/sky130_fd_pr/spice/sky130_fd_pr__nfet_g5v0d10v5.pm3.spice
#       .subckt ... d g s b  (W is TOTAL width; nf splits; m multiplies)
#   libs.ref/sky130_fd_pr/spice/sky130_fd_pr__nfet_01v8__tt.pm3.spice
#       .subckt ... d g s b  (1.8 V core device for the level shifter)
#   libs.ref/sky130_fd_pr/spice/sky130_fd_pr__diode_pd2nw_11v0.model.spice
#   libs.ref/sky130_fd_pr/spice/sky130_fd_pr__diode_pw2nd_11v0.model.spice
#   libs.ref/sky130_fd_pr/spice/sky130_fd_pr__res_high_po.model.spice
#       .subckt sky130_fd_pr__res_high_po r0 r1 b w=1 l=1
#   libs.tech/ngspice/sky130.lib.spice (corner sections tt/ss/ff)
# License: Apache-2.0 (SkyWater PDK Authors).
# 11 V in the diode class name is a device class, not the operating voltage.
backend: sky130
pdk: sky130A
status: topology_template_only
decision: NO_GO
core_v: 1.8
vddio_v: 3.3
level_shifter_required: true
model_include: "libs.tech/ngspice/sky130.lib.spice (corner section tt/ss/ff)"
design_include: "none (device models only)"
license: "Apache-2.0 (SkyWater PDK Authors)"
forbidden:
  - "core standard cell as pad driver"
  - "treating 5 V/11 V device class names as operating voltages"
  - "assuming the input threshold equals VDDIO/2"
size_note: "topology params are metres; sky130 subckts use .option scale=1u (micrometres), apply x1e6 when filling"
esd_note: "2-terminal .model diodes; area unit and clamp orientation still need schematic review"
spice:
  # W is TOTAL width with .option scale=1.0u; nf only splits it, m
  # multiplies the whole subckt. Sizes stay symbolic.
  finger_param: nf
  mult_param: m
  mos_format: "X_{name} {d} {g} {s} {b} {device} w={w} l={l} {fp}={nf} {mp}={m}"
  res_format: "X_{name} {p} {q} {b} {device} w={w} l={l}"
  diode_format: "D_{name} {a} {c} {device} area={area}"
char:
  root_glob: "~/.ciel/ciel/sky130/versions/*/sky130A"
  root_must_contain: "libs.tech/ngspice/sky130.lib.spice"
  cwd: "libs.tech/ngspice"
  ngspice_flags: ["-n"]
  corners: {tt: tt, ss: ss, ff: ff}
  temps: {tt: 27, ss: 125, ff: -40}
  spiceinit: "* unused (ngspice -n)\n"
  includes:
    - {lib: "libs.tech/ngspice/sky130.lib.spice", section: "tt"}
slots:
  NMOS_IO:        {device: sky130_fd_pr__nfet_g5v0d10v5, symbol: null, verified: ".subckt ... d g s b; W total, nf splits, m multiplies; measured"}
  PMOS_IO:        {device: sky130_fd_pr__pfet_g5v0d10v5, symbol: null, verified: ".subckt ... d g s b; measured"}
  NMOS_CORE:      {device: sky130_fd_pr__nfet_01v8, symbol: null, verified: ".subckt ... d g s b; 1.8 V core device"}
  PMOS_CORE:      {device: sky130_fd_pr__pfet_01v8, symbol: null, verified: ".subckt ... d g s b; 1.8 V core device"}
  DIODE_TO_VSSIO: {device: sky130_fd_pr__diode_pw2nd_11v0, symbol: null, verified: ".model ... d; N+/Pwell, anode VSSIO"}
  DIODE_TO_VDDIO: {device: sky130_fd_pr__diode_pd2nw_11v0, symbol: null, verified: ".model ... d; P+/Nwell, cathode VDDIO"}
  DIODE_CLAMP:    {device: sky130_fd_pr__diode_pd2nw_11v0, symbol: null, verified: ".model ... d; clamp anode VSSIO, cathode VDDIO"}
  RES_SERIES:     {device: sky130_fd_pr__res_high_po, symbol: null, verified: ".subckt ... r0 r1 b w=1 l=1"}
  PREDRIVER:      {device: null, symbol: null, note: "composite NMOS_IO/PMOS_IO inverter; PDRV_STAGES unresolved"}
  RX_INV:         {device: null, symbol: null, note: "composite NMOS_IO/PMOS_IO inverter; Schmitt option TBD"}
sdr: {status: IN_SCOPE, note: "section 6: DO with self-drawn pad and level shifter"}
ddr1:
  status: experimental_witness
  reason: 2.5 V is not a characterized sky130 IO library
  signoff: false
  simulator: xyce
  root_glob: ~/.ciel/ciel/sky130/versions/8afc8346a57fe1ab7934ba5a6056ea8b43078e71/sky130A
  xyce:
    pm3: 'libs.ref/sky130_fd_pr/spice/{device}__{corner}.pm3.spice'
    # res_high_po.model.spice: linear sheet terms, geometry in um, at 30 C.
    resistor:
      body_sheet_ohm: 317.3885
      head_sheet_ohm: 345.8312
      width_offset_um: -0.001
      narrow_below_um: 0.69
      narrow_factor: 0.0672
      length_offset_um: 0.247
      head_length_um: 1
      head_width_offset_um: 0.1558
    # Area-normalized level-1 junction approximation; no sidewall or ESD qualification.
    diodes:
      DIODE_TO_VDDIO: {is: 2.1483e-17, n: 1.3632, rs: 600, cjo: 7.7547e-16, m: 0.33956, vj: 0.6587, bv: 12.69, ibv: 0.00106, eg: 1.05, xti: 10}
      DIODE_TO_VSSIO: {is: 3.75e-16, n: 1.0773, rs: 981, cjo: 8.512e-16, m: 0.295, vj: 0.72468, bv: 12.636, ibv: 0.00106, eg: 0.92, xti: 0.76}
