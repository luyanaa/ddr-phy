# SPDX-License-Identifier: Apache-2.0
# gf180mcuD device map. Names verified against the LOCAL PDK on 2026-11-15:
#   libs.tech/ngspice/sm141064.ngspice : .subckt nfet_03v3 / pfet_03v3,
#       .subckt ppolyf_u, .subckt nplus_u/pplus_u etc.
#   libs.tech/xschem/symbols           : nfet_03v3.sym, pfet_03v3.sym,
#       diode_nd2ps_03v3.sym, diode_pd2nw_03v3.sym, ppolyf_u.sym
#   libs.tech/ngspice/design.ngspice   : Apache-2.0 header (compatible).
#   libs.ref/gf180mcu_fd_io/spice      : existing GPIO is a STRUCTURAL
#       reference only, not this design's pad (ARCHITECTURE.md section 5).
backend: gf180mcuD
pdk: gf180mcuD
status: topology_template_only
decision: NO_GO
core_v: 3.3
vddio_v: 3.3
level_shifter_required: false
level_shifter_note: "Nominal core and IO voltages are equal; ARCHITECTURE.md section 5.1 says no level shift. Pre-driver still required."
model_include: "libs.tech/ngspice/sm141064.ngspice"
design_include: "libs.tech/ngspice/design.ngspice"
license: "Apache-2.0 (GlobalFoundries PDK Authors, design.ngspice header)"
forbidden:
  - "nfet_06v0 / pfet_06v0 (6 V devices; section 5.1)"
  - "gf180mcu_ef_io / gf180mcu_fd_io 5 V GPIO (4.5-5.5 V, cannot drive 3.3 V SDRAM)"
  - "any core standard cell as the pad driver"
slots:
  NMOS_IO:        {device: nfet_03v3,        symbol: gf180mcu_fd_pr/nfet_03v3.sym,       verified: ".subckt nfet_03v3 d g s b w=.. l=.. nf=.. m=.."}
  PMOS_IO:        {device: pfet_03v3,        symbol: gf180mcu_fd_pr/pfet_03v3.sym,       verified: ".subckt pfet_03v3 d g s b w=.. l=.. nf=.. m=.."}
  NMOS_CORE:      {device: null, symbol: null, note: "no level shifter (core_v == vddio_v)"}
  PMOS_CORE:      {device: null, symbol: null, note: "no level shifter (core_v == vddio_v)"}
  DIODE_TO_VSSIO: {device: diode_nd2ps_03v3, symbol: gf180mcu_fd_pr/diode_nd2ps_03v3.sym, verified: "3.3 V N+/Psub diode; orientation to confirm"}
  DIODE_TO_VDDIO: {device: diode_pd2nw_03v3, symbol: gf180mcu_fd_pr/diode_pd2nw_03v3.sym, verified: "3.3 V P+/Nwell diode; orientation to confirm"}
  DIODE_CLAMP:    {device: diode_pd2nw_03v3, symbol: gf180mcu_fd_pr/diode_pd2nw_03v3.sym, verified: "VDDIO-VSSIO clamp; topology only"}
  RES_SERIES:     {device: ppolyf_u,         symbol: gf180mcu_fd_pr/ppolyf_u.sym,        verified: ".subckt ppolyf_u 1 2 3 r_length=l r_width=w"}
  PREDRIVER:      {device: param_stage,      symbol: null, note: "PDRV_STAGES unresolved; one representative inverter stage emitted"}
  RX_INV:         {device: cmos_inverter,    symbol: null, note: "nfet_03v3 + pfet_03v3 pair; Schmitt option TBD"}
sdr:
  status: IN_SCOPE
  note: "ARCHITECTURE.md section 6: gf180mcu SDR is DO. 3.3 V self-drawn pad, 3.3 V AS stdcells."
ddr1:
  status: DEFERRED_LONG_TERM
  target_phase: "P4+ (after a 2.5 V SSTL_2 / VREF IO backend exists)"
  reason: "Long-term plan, not a current deliverable. ARCHITECTURE.md section 1 already says gf180 DDR1 is not done this period; section 6 now records it as DEFERRED rather than a hard exclusion. Still blocked: 2.5 V SSTL_2 / VREF IO, no 2.5 V device model, unresolved ck90, and an uncharacterized VREF receiver."
  vref_receiver: "generated as a TOPOLOGY STUDY ONLY, not a supported configuration"
  blockers:
    - "2.5 V SSTL_2 pad and VREF receiver characterization"
    - "gf180 has only 3.3 V (plus 5/6 V) IO devices; no 2.5 V IO model"
    - "ck90 / phase source still unresolved (capability gate G6)"
  user_override_needed: false
  decision: NO_GO
